[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jpshot"
version = "0.1.0"
description = "Flameshot-style screenshot tool for learning Japanese: OCR, translation, furigana, dictionary hover, TTS"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "pytesseract>=0.3.10",
    "Pillow>=9",
    "deep-translator>=1.11",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "edge-tts>=6.1",
    "gTTS>=2.3",
    "requests>=2.28",
    "pynput>=1.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
offline-dict = ["jamdict", "jamdict-data"]
offline-translate = ["argostranslate"]
manga = ["manga-ocr"]

[project.scripts]
jpshot = "jpshot.__main__:main"

[tool.setuptools]
packages = ["jpshot"]
